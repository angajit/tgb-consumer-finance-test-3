<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGB Consumer Finance Portal</title>
<style>
/* OLD SCHOOL ENTERPRISE STYLING */
:root {
    --bg: #d4d0c8; /* Classic Windows gray */
    --sf: #ffffff;
    --tx: #000000;
    --bd: #808080; /* Hard dark gray border */
    --bl: #004d28; /* TGB Dark Green */
    --or: #c8871a; /* TGB Gold */
    --ok: #006600;
    --er: #cc0000;
    --hl: #0A246A; /* Highlight blue for selected rows */
    box-sizing: border-box;
}
html { height: 100%; }
* { box-sizing: border-box; }
body { 
    margin: 0; 
    height: 100%; 
    font: 12px/1.4 Tahoma, Arial, sans-serif; /* Classic system font */
    background: var(--bg); 
    color: var(--tx); 
}

/* BOOT SCREEN */
#boot { position: fixed; inset: 0; z-index: 50; background: var(--bl); color: #fff; display: flex; align-items: center; justify-content: center; }
.bx { width: 400px; background: var(--bg); color: var(--tx); border: 2px outset #fff; padding: 20px; }
.bx h1 { margin: 0; font-size: 18px; color: var(--bl); font-family: "Times New Roman", Times, serif; }
.pb { height: 12px; background: #fff; border: 1px inset #808080; margin: 15px 0 5px; }
.pb i { display: block; height: 100%; width: 0; background: var(--bl); transition: width .4s; }

/* APP LAYOUT */
#app { display: none; height: 100%; flex-direction: column; }

/* HEADER */
header { 
    background: var(--bl); 
    color: #fff; 
    padding: 8px 12px; 
    display: flex; 
    gap: 12px; 
    align-items: center; 
    border-bottom: 4px solid var(--or);
}
header .logo { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: bold; margin-right: auto; }
header .logo small { font-family: Tahoma, Arial, sans-serif; font-size: 11px; font-weight: normal; margin-left: 10px; color: var(--or); }
.role-switcher { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.role-switcher select { font: 11px Tahoma; border: 1px inset #fff; padding: 2px; }

/* BUTTONS - 3D Outset effect */
button { 
    font: 12px Tahoma, Arial, sans-serif; 
    padding: 4px 12px; 
    border: 2px outset #fff; 
    background: var(--bg); 
    color: var(--tx); 
    cursor: pointer; 
}
button:active { border-style: inset; padding: 5px 11px 3px 13px; } /* Heavy physical click feeling */
button.sec { color: #333; }
button.dn { color: var(--er); font-weight: bold; }

/* TABS */
.tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--bd); padding: 4px 4px 0 4px; }
.tabs a { 
    padding: 6px 16px; 
    cursor: pointer; 
    color: var(--tx); 
    border: 1px solid var(--bg); 
    border-top-left-radius: 4px; 
    border-top-right-radius: 4px; 
    margin-right: 2px; 
}
.tabs a.on { background: var(--sf); border-color: var(--bd) var(--bd) var(--sf) var(--bd); font-weight: bold; position: relative; top: 1px; }

/* WORK AREA */
#work { flex: 1; overflow: auto; padding: 16px; background: var(--sf); min-width: 0; }
h2 { margin: 0 0 12px; font-size: 16px; border-bottom: 1px solid var(--bd); padding-bottom: 4px; color: var(--bl); }
h5 { margin: 16px 0 6px; font-size: 13px; background: #e0e0e0; padding: 4px; border: 1px solid var(--bd); }

/* FORMS */
.card { border: 1px solid var(--bd); padding: 12px; margin-bottom: 12px; background: #f9f9f9; }
.fm { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 12px; max-width: 700px; }
.fm label { align-self: center; font-weight: normal; }
.fm input, .fm select { padding: 4px; border: 2px inset #d4d0c8; background: var(--sf); color: var(--tx); font: inherit; min-width: 0; }
.fm input:focus, .fm select:focus { background: #ffffcc; outline: none; }
.bt { margin: 12px 0 6px; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 8px; border-top: 1px dashed #ccc; }

/* TABLES - Strict enterprise grid */
.tw { overflow-x: auto; border: 1px solid var(--bd); margin: 8px 0 16px; }
table { border-collapse: collapse; width: 100%; background: var(--sf); font-size: 11px; }
th { background: #e0e0e0; text-align: left; padding: 6px 8px; border: 1px solid var(--bd); color: #000; font-weight: bold; }
td { padding: 6px 8px; border: 1px solid var(--bd); white-space: nowrap; }
td.n { text-align: right; font-family: "Courier New", Courier, monospace; font-weight: bold; }
tr:hover td { background: #f0f0f0; }
td button, th button { padding: 2px 8px; font-size: 11px; }

.ch { font-weight: bold; text-transform: uppercase; }
.ch.g { color: var(--ok); }
.ch.a { color: var(--or); }
.ch.r { color: var(--er); }

/* STEPS WIZARD */
.stp { display: flex; border: 1px solid var(--bd); margin-bottom: 16px; background: var(--bg); }
.stp a { flex: 1; padding: 6px 8px; border-right: 1px solid var(--bd); text-align: center; cursor: pointer; color: #666; font-size: 11px; }
.stp a:last-child { border-right: none; }
.stp a.d { color: var(--ok); font-weight: bold; }
.stp a.c { background: var(--bl); color: #fff; font-weight: bold; }
.stp a.s { background: var(--or); color: #fff; }
.stp a.l { color: #aaa; cursor: default; }

/* DASHBOARD STATS */
.fun { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.fun div { background: var(--bg); border: 2px outset #fff; padding: 8px 12px; min-width: 120px; text-align: center; }
.fun b { display: block; font-size: 18px; color: var(--bl); }
.fun span { color: #333; font-size: 11px; }

/* MESSAGES */
#msg { display: none; padding: 8px; margin-bottom: 12px; border: 1px solid; background: #fff; font-weight: bold; }
#msg.ok { display: block; color: var(--ok); border-color: var(--ok); background: #e6ffe6; }
#msg.er { display: block; color: var(--er); border-color: var(--er); background: #ffe6e6; }

/* LETTERS */
.ltr { border: 2px solid #000; padding: 20px; background: var(--sf); max-width: 720px; font-family: "Times New Roman", Times, serif; font-size: 14px; }
.ltr h3 { margin: 0; text-align: center; text-decoration: underline; }
.ltr h5 { background: none; border: none; border-bottom: 1px dashed #000; padding: 0; font-size: 14px; margin-top: 20px; }

/* UTILS */
input.q { padding: 4px; border: 2px inset #d4d0c8; width: 250px; }
select.q { padding: 4px; border: 2px inset #d4d0c8; }

/* FOOTER */
footer { border-top: 1px solid var(--bd); background: var(--bg); padding: 4px 12px; display: flex; gap: 20px; font-size: 11px; color: #333; }

/* BUSY SPINNER (HEAVY CLICKS) */
#busy { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; cursor: wait; }
#busy div { background: var(--bg); padding: 20px; border: 2px outset #fff; width: 300px; text-align: center; }
#busy .pb { margin: 15px 0 5px; }

@media print { header, .tabs, footer, .stp, .bt, #msg, .role-switcher { display: none !important; } .ltr { border: none; padding: 0; } }
</style></head><body>

/* NEW: Role switcher function that feels heavy */
function switchRole(val) {
    busy(() => {
        USER = val;
        init(); // rebuild tabs
        renderView('pipe', null, 1);
    }, 'role');
}

/* NEW: Navigation wrapper to make it feel heavy */
function goNav(v) { busy(() => renderView(v), 'nav'); }

function renderView(v,m,ok){
    VIEW=v;
    $('work').innerHTML=(v=='app'?'':'<div id="msg"></div>')+VW[v]();
    document.querySelectorAll('.tabs a').forEach(t=>t.classList.toggle('on',t.dataset.v==(v=='app'?'pipe':v)));
    if(v=='pipe')tbl();
    if(v=='cat')ctb();
    if($('sc'))schChg();else prev();
    if(m)msg(m,ok);
    $('sysRole').value = USER;
    $('huName').textContent = USERS[USER].n;
    $('f1').textContent = USERS[USER].l + ' | ' + USERS[USER].t;
}

const openA=id=>{AID=id;S=null;goNav('app')};

function init(){
    $('tabs').innerHTML=TABS.filter(t=>t[2].includes(ROLE())).map(t=>'<a data-v="'+t[0]+'" tabindex="0" onclick="goNav(\''+t[0]+'\')">'+t[1]+'</a>').join('');
}

function run(steps,done){$('bi').style.width='0';let i=0;(function n(){if(i>=steps.length)return done();$('bm').textContent=steps[i];$('bi').style.width=((i+1)/steps.length*100)+'%';i++;setTimeout(n,250+Math.random()*200)})()}

function reset(){busy(()=>{seed();VIEW='pipe';renderView('pipe','Database wiped and demo data re-seeded.',1)}, 'role')}

if(typeof document!='undefined'&&document.getElementById('boot')){
    try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!db||!db.apps)seed();
    init();
    run(['Booting TGB Secure Gateway...','Connecting to Core Banking DB...','Loading user profiles...','Ready'],()=>{
        $('boot').style.display='none';
        $('app').style.display='flex';
        renderView('pipe');
    });
}
